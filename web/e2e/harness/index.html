<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassShell test harness</title>
    <style>
      html { color-scheme: dark; background: #161312; color: #ece5da; font: 18px/1.7 system-ui, sans-serif; }
      body { margin: 0; }
      .file-help { max-width: 42rem; margin: 10vh auto; padding: 2rem; border: 1px solid #4a423a; background: #201c1a; }
      .file-help h1 { margin-top: 0; font-family: Georgia, serif; }
      .file-help code { color: #d9b871; overflow-wrap: anywhere; }
      .file-help a { color: #ddb45f; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="file-help">
        <h1>這是測試伺服器入口</h1>
        <p>此頁使用 TSX 與測試資料，不能直接透過 <code>file://</code> 執行。</p>
        <p>請先在 <code>web</code> 目錄啟動測試伺服器，再開啟：</p>
        <p><a href="http://127.0.0.1:4173/e2e/harness/">http://127.0.0.1:4173/e2e/harness/</a></p>
      </main>
    </div>
    <script>
      if (location.protocol !== 'file:') {
        const entry = document.createElement('script')
        entry.type = 'module'
        entry.src = '/e2e/harness/main.tsx'
        document.body.append(entry)
      }
    </script>
  </body>
</html>
